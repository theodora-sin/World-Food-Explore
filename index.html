<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>World Food Explore</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="icon" type="image/png" href="images/favicon_food.png"/>
</head>
<body>
    <div id="label-layer" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5;"></div>
    <svg id="label-lines" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:4;"></svg>
    <div id="globeWrap">
        <div id="globeViz"></div>
    </div>
    <div id="map"></div>

  <div id="info-box">Spin the globe → Tap a city → Discover local food</div>

  <div id="city-info" role="dialog" aria-hidden="true">
    <button id="city-close" aria-label="Close">✕</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./main.js"></script>
</body>

</html>
